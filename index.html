<body class="bg-[#E6F0FA] text-[#0F2942] font-sans antialiased">
  <div id="root"></div>
  <script>

(function() {
  // Ganti URL ini satu kali setelah Cloudflare Worker backend selesai di-deploy.
  var DAPP_BUILD_API = "https://dapp-builder-api-v2.bimmjhi.workers.dev";

  var state = {
    appName: "",
    packageName: "",
    version: "1.0",
    sourceType: "url",
    url: "",
    html: "",
    orientation: "sensor",
    fullscreen: false,
    keepScreenOn: true,
    permissions: {
      internet: true,
      camera: false,
      location: false
    },
    logoDataUrl: null,
    errorMsg: null,
    copySuccess: false,
    activeTabOutput: "none",
    savedHistory: null,
    isZipping: false,
    isBuilding: false,
    turnstileToken: "",
    buildId: null,
    buildMessage: "",
    apkReady: false
  };

  try {
    var saved = localStorage.getItem("dapp_builder_last");
    if (saved) {
      state.savedHistory = JSON.parse(saved);
    }
  } catch (e) {}

  function getPkg() {
    if (state.packageName.trim()) return state.packageName.trim();
    var clean = state.appName.trim().toLowerCase().replace(/[^a-z0-9]/g, "_").replace(/_+/g, "_").replace(/^_+|_+$/g, "");
    var suffix = clean || "my_app";
    return "com.dapp." + suffix;
  }

  function validateForm() {
    state.errorMsg = null;
    if (!state.appName.trim()) {
      state.errorMsg = "Nama aplikasi wajib diisi.";
      return false;
    }
    if (state.sourceType === "url") {
      if (!state.url.trim()) {
        state.errorMsg = "Link website wajib diisi.";
        return false;
      }
      if (!state.url.startsWith("http://") && !state.url.startsWith("https://")) {
        state.errorMsg = "Link website harus diawali dengan http:// atau https://";
        return false;
      }
    } else {
      if (!state.html.trim()) {
        state.errorMsg = "Isi HTML wajib ditempel.";
        return false;
      }
    }
    if (!/^[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z][A-Za-z0-9_]*){1,5}$/.test(getPkg())) {
      state.errorMsg = "Package Name tidak valid. Contoh: com.dapp.aplikasi";
      return false;
    }
    if (state.version.trim() && !/^[A-Za-z0-9][A-Za-z0-9._+-]{0,29}$/.test(state.version.trim())) {
      state.errorMsg = "Versi hanya boleh berisi huruf, angka, titik, garis bawah, +, atau -.";
      return false;
    }
    return true;
  }

  function saveHistory(finalConfig) {
    try {
      var timestamp = new Date().toLocaleDateString("id-ID", {
        day: "numeric",
        month: "short",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      });
      var item = Object.assign({}, finalConfig, { createdAt: timestamp });
      localStorage.setItem("dapp_builder_last", JSON.stringify(item));
      state.savedHistory = item;
    } catch (e) {}
  }

  function waitMs(ms) {
    return new Promise(function(resolve) { setTimeout(resolve, ms); });
  }

  async function downloadBuiltApk() {
    try {
      var response = await fetch(DAPP_BUILD_API.replace(/\/$/, "") + "/download?build_id=" + encodeURIComponent(state.buildId));
      if (!response.ok) {
        var errData = await response.json().catch(function() { return {}; });
        throw new Error(errData.error || "APK belum bisa diunduh.");
      }
      var blob = await response.blob();
      var objectUrl = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = objectUrl;
      a.download = (state.appName.trim().replace(/[^a-z0-9_-]/gi, "-") || "app") + ".apk";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function() { URL.revokeObjectURL(objectUrl); }, 30000);
    } catch (error) {
      state.errorMsg = error.message || "Gagal mengunduh APK.";
      render();
    }
  }

  async function startApkBuild() {
    if (state.apkReady && state.buildId) {
      await downloadBuiltApk();
      return;
    }
    if (state.isBuilding) return;
    if (DAPP_BUILD_API.indexOf("YOUR-WORKER") !== -1) {
      state.errorMsg = "Backend belum dihubungkan. Atur URL Cloudflare Worker pada DAPP_BUILD_API di index.html.";
      render();
      return;
    }
    if (!validateForm()) { render(); return; }

    var finalConfig = {
      appName: state.appName.trim(),
      packageName: getPkg(),
      version: state.version.trim() || "1.0",
      sourceType: state.sourceType,
      url: state.sourceType === "url" ? state.url.trim() : "",
      orientation: state.orientation,
      fullscreen: state.fullscreen,
      keepScreenOn: state.keepScreenOn,
      permissions: state.permissions
    };
    saveHistory(finalConfig);
    state.isBuilding = true;
    state.apkReady = false;
    state.buildId = null;
    state.errorMsg = null;
    state.activeTabOutput = "build";
    state.buildMessage = "Mengirim permintaan build ke GitHub Actions...";
    render();

    try {
      var response = await fetch(DAPP_BUILD_API.replace(/\/$/, "") + "/build", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
  config: finalConfig,
  html: state.sourceType === "html" ? state.html : "",
  logoDataUrl: state.logoDataUrl || null,
  turnstileToken: state.turnstileToken || ""
})
      });
      var data = await response.json().catch(function() { return {}; });
      if (!response.ok || !data.ok || !data.build_id) {
        throw new Error(data.error || "Backend gagal menerima permintaan build.");
      }
      state.buildId = data.build_id;
      state.buildMessage = "Permintaan diterima. Menyiapkan Android SDK dan proses kompilasi...";
      render();

      for (var attempt = 0; attempt < 180; attempt++) {
        await waitMs(5000);
        var statusResponse = await fetch(DAPP_BUILD_API.replace(/\/$/, "") + "/status?build_id=" + encodeURIComponent(state.buildId));
        var statusData = await statusResponse.json().catch(function() { return {}; });
        if (!statusResponse.ok) throw new Error(statusData.error || "Gagal memeriksa status build.");

        if (statusData.status === "completed") {
          if (statusData.conclusion === "success") {
            state.apkReady = true;
            state.buildMessage = "APK berhasil dibuat. Tekan tombol INSTALL APK untuk mengunduhnya.";
            state.isBuilding = false;
            render();
            return;
          }
          throw new Error("Build gagal. Buka log GitHub Actions untuk melihat penyebabnya.");
        }
        state.buildMessage = statusData.status === "in_progress"
          ? "Sedang mengompilasi APK... Mohon tunggu."
          : "Menunggu antrean GitHub Actions...";
        render();
      }
      throw new Error("Build memerlukan waktu terlalu lama. Periksa tab Actions pada repository backend.");
    } catch (error) {
      state.isBuilding = false;
      state.buildMessage = "Build belum berhasil diselesaikan.";
      state.errorMsg = error.message || "Terjadi kesalahan saat membuat APK.";
      render();
    }
  }

  function attachEvents(root) {
    var btnSrcUrl = root.querySelector("#btn-src-url");
    if (btnSrcUrl) btnSrcUrl.onclick = function() { state.sourceType = "url"; render(); };

    var btnSrcHtml = root.querySelector("#btn-src-html");
    if (btnSrcHtml) btnSrcHtml.onclick = function() { state.sourceType = "html"; render(); };

    var inputUrl = root.querySelector("#input-url");
    if (inputUrl) inputUrl.oninput = function(e) { state.url = e.target.value; };

    var inputHtml = root.querySelector("#input-html");
    if (inputHtml) inputHtml.oninput = function(e) { state.html = e.target.value; };

    var inputAppName = root.querySelector("#input-appname");
    if (inputAppName) inputAppName.oninput = function(e) { state.appName = e.target.value; render(); };

    var inputPkg = root.querySelector("#input-pkg");
    if (inputPkg) inputPkg.oninput = function(e) { state.packageName = e.target.value; render(); };

    var inputVersion = root.querySelector("#input-version");
    if (inputVersion) inputVersion.oninput = function(e) { state.version = e.target.value; };

    var inputLogo = root.querySelector("#input-logo");
    if (inputLogo) {
      inputLogo.onchange = function(e) {
        var file = e.target.files && e.target.files[0];
        if (file) {
          if (file.size > 2 * 1024 * 1024) {
            state.errorMsg = "Ukuran file logo maksimal 2MB";
            render();
            return;
          }
          var reader = new FileReader();
          reader.onload = function(evt) {
            var image = new Image();
            image.onload = function() {
              var canvas = document.createElement("canvas");
              canvas.width = 512;
              canvas.height = 512;
              var ctx = canvas.getContext("2d");
              var scale = Math.min(512 / image.width, 512 / image.height);
              var width = image.width * scale;
              var height = image.height * scale;
              ctx.clearRect(0, 0, 512, 512);
              ctx.drawImage(image, (512 - width) / 2, (512 - height) / 2, width, height);
              state.logoDataUrl = canvas.toDataURL("image/png");
              render();
            };
            image.onerror = function() { state.errorMsg = "Logo tidak dapat dibaca."; render(); };
            image.src = evt.target.result;
          };
          reader.readAsDataURL(file);
        }
      };
    }

    root.querySelectorAll(".btn-orient").forEach(function(btn) {
      btn.onclick = function() {
        state.orientation = btn.getAttribute("data-orient");
        render();
      };
    });

    var toggleFS = root.querySelector("#toggle-fullscreen");
    if (toggleFS) toggleFS.onclick = function() { state.fullscreen = !state.fullscreen; render(); };

    var toggleKS = root.querySelector("#toggle-keepScreenOn");
    if (toggleKS) toggleKS.onclick = function() { state.keepScreenOn = !state.keepScreenOn; render(); };

    root.querySelectorAll(".btn-perm").forEach(function(btn) {
      btn.onclick = function() {
        var p = btn.getAttribute("data-perm");
        state.permissions[p] = !state.permissions[p];
        render();
      };
    });

    var btnBuatApk = root.querySelector("#btn-buat-apk");
    if (btnBuatApk) {
      btnBuatApk.onclick = function() { startApkBuild(); };
    }

    var btnCopyCfg = root.querySelector("#btn-copy-cfg");
    if (btnCopyCfg) {
      btnCopyCfg.onclick = function() {
        var jsonStr = getConfigJsonStr();
        navigator.clipboard.writeText(jsonStr);
        state.copySuccess = true;
        render();
        setTimeout(function() { state.copySuccess = false; render(); }, 2000);
      };
    }

    var btnDlCfg = root.querySelector("#btn-dl-cfg");
    if (btnDlCfg) {
      btnDlCfg.onclick = function() {
        var jsonStr = getConfigJsonStr();
        var blob = new Blob([jsonStr], { type: "application/json" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = "config.json";
        a.click();
        URL.revokeObjectURL(url);
      };
    }

    var btnDlZip = root.querySelector("#btn-download-zip");
    if (btnDlZip) {
      btnDlZip.onclick = async function() {
        if (!validateForm()) { render(); return; }
        if (!window.JSZip) {
          state.errorMsg = "Library JSZip belum siap.";
          render();
          return;
        }
        var finalPkg = getPkg();
        var finalConfig = Object.assign({}, state, { packageName: finalPkg });
        saveHistory(finalConfig);
        state.activeTabOutput = "zip";
        state.isZipping = true;
        render();

        try {
          var zip = new window.JSZip();
          var jsonStr = getConfigJsonStr();
          var pkgPath = finalPkg.replace(/\./g, "/");
          var appNameClean = state.appName.trim();

          zip.file("config.json", jsonStr);

          var pXml = state.permissions.internet || state.sourceType === "url" ? "    <uses-permission android:name=\"android.permission.INTERNET\" />\n" : "";
          if (state.permissions.camera) {
            pXml += "    <uses-permission android:name=\"android.permission.CAMERA\" />\n";
          }
          if (state.permissions.location) {
            pXml += "    <uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\" />\n    <uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\" />\n";
          }

          var iconRef = state.logoDataUrl ? "@mipmap/ic_launcher" : "@android:drawable/sym_def_app_icon";
          var manifestXml = "<?xml version=\"1.0\" encoding=\"utf-8\"?>\n" +
            "<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">\n" +
            pXml +
            "    <application android:allowBackup=\"false\" android:icon=\"" + iconRef + "\" android:label=\"" + escapeHtml(appNameClean) + "\" android:roundIcon=\"" + iconRef + "\" android:supportsRtl=\"true\" android:usesCleartextTraffic=\"true\" android:theme=\"@android:style/Theme.Material.Light.NoActionBar\">\n" +
            "        <activity android:name=\"" + finalPkg + ".MainActivity\" android:exported=\"true\" android:configChanges=\"orientation|screenSize|keyboardHidden\" android:screenOrientation=\"" + state.orientation + "\">\n" +
            "            <intent-filter><action android:name=\"android.intent.action.MAIN\" /><category android:name=\"android.intent.category.LAUNCHER\" /></intent-filter>\n" +
            "        </activity>\n    </application>\n</manifest>";

          zip.file("app/src/main/AndroidManifest.xml", manifestXml);

          var screenFlags = "";
          if (state.keepScreenOn) {
            screenFlags += "        getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);\n";
          }
          if (state.fullscreen) {
            screenFlags += "        getWindow().getDecorView().setSystemUiVisibility(\n" +
              "            View.SYSTEM_UI_FLAG_FULLSCREEN |\n" +
              "            View.SYSTEM_UI_FLAG_HIDE_NAVIGATION |\n" +
              "            View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY\n" +
              "        );\n";
          }

          var loadContentCode = state.sourceType === "url"
            ? "webView.loadUrl(\"" + state.url.trim() + "\");"
            : "webView.loadUrl(\"file:///android_asset/index.html\");";

          var mainActivityJava = "package " + finalPkg + ";\n\n" +
            "import android.app.Activity;\nimport android.os.Bundle;\nimport android.view.View;\nimport android.view.WindowManager;\nimport android.webkit.WebSettings;\nimport android.webkit.WebView;\nimport android.webkit.WebViewClient;\nimport org.json.JSONObject;\nimport java.io.ByteArrayOutputStream;\nimport java.io.InputStream;\n\n" +
            "public class MainActivity extends Activity {\n    private WebView webView;\n" +
            "    private String readAsset(String name) throws Exception { InputStream in=getAssets().open(name); ByteArrayOutputStream out=new ByteArrayOutputStream(); byte[] b=new byte[8192]; int n; while((n=in.read(b))!=-1) out.write(b,0,n); in.close(); return out.toString(\"UTF-8\"); }\n" +
            "    @Override protected void onCreate(Bundle savedInstanceState) { super.onCreate(savedInstanceState); try { JSONObject c=new JSONObject(readAsset(\"config.json\"));\n" +
            (state.keepScreenOn ? "        getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);\n" : "") +
            (state.fullscreen ? "        getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_FULLSCREEN | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);\n" : "") +
            "        webView=new WebView(this); setContentView(webView); WebSettings w=webView.getSettings(); w.setJavaScriptEnabled(true); w.setDomStorageEnabled(true); w.setDatabaseEnabled(true); w.setAllowFileAccess(true); w.setAllowContentAccess(true); webView.setWebViewClient(new WebViewClient()); if(\"url\".equals(c.optString(\"sourceType\"))) webView.loadUrl(c.optString(\"url\")); else webView.loadUrl(\"file:///android_asset/index.html\"); } catch(Exception e) { webView=new WebView(this); setContentView(webView); webView.loadData(\"Unable to load app content.\",\"text/plain\",\"UTF-8\"); } }\n" +
            "    @Override public void onBackPressed() { if(webView!=null && webView.canGoBack()) webView.goBack(); else super.onBackPressed(); }\n}";

          zip.file("app/src/main/java/" + pkgPath + "/MainActivity.java", mainActivityJava);

          zip.file("app/src/main/assets/config.json", jsonStr);
          if (state.sourceType === "html") {
            zip.file("app/src/main/assets/index.html", state.html);
          }

          if (state.logoDataUrl) {
            var base64Data = state.logoDataUrl.replace(/^data:image\/(png|jpeg|jpg);base64,/, "");
            zip.file("app/src/main/res/mipmap/ic_launcher.png", base64Data, { base64: true });
          }

          var githubWorkflow = "name: Build Android APK\n\non:\n  workflow_dispatch:\n\npermissions:\n  contents: read\n\njobs:\n  build:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-java@v4\n        with:\n          distribution: temurin\n          java-version: \x2717\x27\n      - uses: gradle/actions/setup-gradle@v4\n        with:\n          gradle-version: \x278.9\x27\n      - name: Build APK\n        run: gradle --no-daemon assembleDebug\n      - uses: actions/upload-artifact@v4\n        with:\n          name: app-debug-apk\n          path: app/build/outputs/apk/debug/app-debug.apk\n          if-no-files-found: error\n";
          zip.file(".github/workflows/build-apk.yml", githubWorkflow);

          zip.file("settings.gradle", "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }\ndependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }\nrootProject.name = \"DAPPGeneratedApp\"\ninclude \x27:app\x27\n");
          zip.file("build.gradle", "plugins { id \x27com.android.application\x27 version \x278.7.3\x27 apply false }\n");
          zip.file("gradle.properties", "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8\nandroid.useAndroidX=true\nandroid.nonTransitiveRClass=true\n");
          zip.file("app/build.gradle", "plugins { id \x27com.android.application\x27 }\nandroid { namespace \"" + finalPkg + "\"; compileSdk 35; defaultConfig { applicationId \"" + finalPkg + "\"; minSdk 23; targetSdk 35; versionCode 1; versionName \"" + (state.version.trim() || "1.0") + "\" } }\n");
          zip.file("app/src/main/res/values/strings.xml", "<?xml version=\"1.0\" encoding=\"utf-8\"?><resources><string name=\"app_name\">" + escapeHtml(appNameClean) + "</string></resources>");

          var readmeTxt = "=========================================\n DAPP BUILDER - Android Project Template\n=========================================\n\nNama App: " + appNameClean + "\nPackage : " + finalPkg + "\nVersi   : " + (state.version || "1.0") + "\nSumber  : " + (state.sourceType === "url" ? state.url : "HTML lokal") + "\n\n-----------------------------------------\nCARA BUILD KE APK VIA GITHUB ACTIONS\n-----------------------------------------\n1. Buat repositori baru di GitHub.\n2. Ekstrak file ZIP ini, lalu unggah seluruh isinya ke repositori GitHub kamu.\n3. Buka tab \"Actions\" di repositori GitHub kamu.\n4. Jalankan workflow \"Build Android APK\".\n5. Setelah workflow sukses, unduh artifact \"app-debug-apk\" dan ekstrak file app-debug.apk untuk dipasang.\n\n-----------------------------------------\nCARA BUILD DENGAN ANDROID STUDIO\n-----------------------------------------\n1. Buka aplikasi Android Studio di komputer.\n2. Impor direktori project ini.\n3. Klik menu \"Build\" -> \"Build Bundle(s) / APK(s)\" -> \"Build APK(s)\".\n4. File APK siap digunakan.\n";
          zip.file("README.txt", readmeTxt);

          var content = await zip.generateAsync({ type: "blob" });
          var slug = appNameClean.toLowerCase().replace(/[^a-z0-9]/g, "-").replace(/-+/g, "-");
          var filename = (slug || "dapp") + "-project.zip";

          var url = URL.createObjectURL(content);
          var link = document.createElement("a");
          link.href = url;
          link.download = filename;
          link.click();
          URL.revokeObjectURL(url);
        } catch (err) {
          state.errorMsg = "Gagal membuat file ZIP project.";
        } finally {
          state.isZipping = false;
          render();
        }
      };
    }

    var btnLoadHist = root.querySelector("#btn-load-hist");
    if (btnLoadHist && state.savedHistory) {
      btnLoadHist.onclick = function() {
        var h = state.savedHistory;
        state.appName = h.appName || "";
        state.packageName = h.packageName || "";
        state.version = h.version || "1.0";
        state.sourceType = h.sourceType || "url";
        state.url = h.url || "";
        state.html = h.html || "";
        state.orientation = h.orientation || "sensor";
        state.fullscreen = !!h.fullscreen;
        state.keepScreenOn = !!h.keepScreenOn;
        if (h.permissions) state.permissions = Object.assign({}, h.permissions);
        state.logoDataUrl = h.logoDataUrl || null;
        state.activeTabOutput = "none";
        state.errorMsg = null;
        render();
      };
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", render);
  } else {
    render();
  }
})();

  </script>
</body>
</html>


name: DAPP BUILDER - Build APK

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "Build Request ID"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Validate Build ID
        env:
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          if ! [[ "$BUILD_ID" =~ ^[0-9a-fA-F-]{20,40}$ ]]; then
            echo "Invalid Build ID"
            exit 1
          fi

      - name: Prepare Android Project
        env:
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          python scripts/prepare_build.py "$BUILD_ID"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: build-workspace
        run: |
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DAPP-BUILDER-APK
          path: build-workspace/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
